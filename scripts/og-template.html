<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image template — 1200x630</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; padding: 0; background: #2D2D2A; }
      .card {
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(1200px 600px at 20% 20%, rgba(91, 157, 117, 0.35), transparent 60%),
          radial-gradient(900px 500px at 100% 100%, rgba(255, 200, 100, 0.18), transparent 65%),
          #FBFAF8;
        color: #1A1A1A;
        font-family: 'Geist', system-ui, sans-serif;
        position: relative;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        padding: 80px 90px;
        box-sizing: border-box;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 500;
        color: #4A4842;
        background: #ffffff;
        border: 1px solid #EBE7DD;
        padding: 10px 18px;
        border-radius: 999px;
        margin-bottom: 36px;
      }
      .badge .dot {
        width: 10px; height: 10px;
        border-radius: 999px; background: #3F7A55;
      }
      h1 {
        font-size: 84px;
        line-height: 1.02;
        letter-spacing: -0.025em;
        font-weight: 600;
        margin: 0 0 28px;
        max-width: 720px;
      }
      h1 .accent { color: #3F7A55; }
      .features {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        max-width: 720px;
      }
      .feat {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 24px;
        font-weight: 500;
        color: #2E2D29;
        background: #ffffff;
        border: 1px solid #EBE7DD;
        padding: 12px 22px;
        border-radius: 14px;
      }
      .feat svg { width: 22px; height: 22px; color: #3F7A55; }
      .right {
        width: 280px;
        height: 280px;
        background: #3F7A55;
        border-radius: 36px;
        display: grid;
        place-items: center;
        box-shadow: 0 20px 60px rgba(63, 122, 85, 0.45);
        transform: rotate(-4deg);
      }
      .right svg { width: 170px; height: 170px; color: #FBFAF8; }
      .url {
        position: absolute;
        bottom: 36px;
        left: 90px;
        font-size: 20px;
        font-weight: 500;
        color: #4A4842;
        letter-spacing: 0.02em;
      }
      .url .accent { color: #3F7A55; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div>
        <div class="badge">
          <span class="dot"></span>
          Open source · MIT licensed
        </div>
        <h1>Free CV Builder. <span class="accent">No signup, no watermark.</span></h1>
        <div class="features">
          <div class="feat">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.704 5.29a.75.75 0 0 1 .006 1.06l-7.5 7.59a.75.75 0 0 1-1.07.005l-3.75-3.75a.75.75 0 1 1 1.06-1.06l3.213 3.213 6.97-7.052a.75.75 0 0 1 1.061-.006Z" clip-rule="evenodd"/></svg>
            No paywall
          </div>
          <div class="feat">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.704 5.29a.75.75 0 0 1 .006 1.06l-7.5 7.59a.75.75 0 0 1-1.07.005l-3.75-3.75a.75.75 0 1 1 1.06-1.06l3.213 3.213 6.97-7.052a.75.75 0 0 1 1.061-.006Z" clip-rule="evenodd"/></svg>
            No signup
          </div>
          <div class="feat">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.704 5.29a.75.75 0 0 1 .006 1.06l-7.5 7.59a.75.75 0 0 1-1.07.005l-3.75-3.75a.75.75 0 1 1 1.06-1.06l3.213 3.213 6.97-7.052a.75.75 0 0 1 1.061-.006Z" clip-rule="evenodd"/></svg>
            Just a PDF
          </div>
        </div>
      </div>
      <div class="right">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path d="M4.5 3A1.5 1.5 0 0 0 3 4.5v11A1.5 1.5 0 0 0 4.5 17h11a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 15.5 3h-11ZM7 7.25a.75.75 0 0 1 .75-.75h4.5a.75.75 0 0 1 0 1.5h-4.5A.75.75 0 0 1 7 7.25Zm.75 2.75a.75.75 0 0 0 0 1.5h4.5a.75.75 0 0 0 0-1.5h-4.5Zm0 3.25a.75.75 0 0 0 0 1.5h2.5a.75.75 0 0 0 0-1.5h-2.5Z"/>
        </svg>
      </div>
      <div class="url"><span class="accent">→</span> buildmyfree.cv</div>
    </div>
  </body>
</html>
